[project]
name = "peeled-server"
version = "0.1.0"
description = "PEELED game server — authoritative backend for the global package-passing game"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Daniel Salama", email = "danielsalama88@gmail.com" }]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "asyncpg>=0.29.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "redis>=5.0.8",
  "httpx>=0.27.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "PyJWT>=2.9.0",
  "structlog>=24.4.0",
  "sentry-sdk[fastapi]>=2.13.0",
  "prometheus-client>=0.20.0",
  "firebase-admin>=6.5.0",
  "websockets>=13.0",
  "orjson>=3.10.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-redis>=4.6.0",
  "freezegun>=1.5.0",
  "fakeredis>=2.24.0",
  "pytest-env>=1.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v --strict-markers --tb=short"
testpaths = ["tests"]
env = [
  "PEELED_ENV=test",
  "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/peeled_test",
  "REDIS_URL=redis://localhost:6379/15",
  "JWT_SECRET=test-secret-never-prod",
  "ANTI_CHEAT_SIGNING_SECRET=test-anti-cheat-secret",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["firebase_admin.*", "fakeredis.*"]
ignore_missing_imports = true
