version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peeled
      POSTGRES_USER: peeled
      POSTGRES_PASSWORD: peeled
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peeled -d peeled"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PEELED_ENV: local
      DATABASE_URL: postgresql+asyncpg://peeled:peeled@postgres:5432/peeled
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-dev-jwt-secret-change-me
      ANTI_CHEAT_SIGNING_SECRET: local-dev-ac-secret-change-me
    ports:
      - "8000:8000"

  ticker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.ticker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PEELED_ENV: local
      DATABASE_URL: postgresql+asyncpg://peeled:peeled@postgres:5432/peeled
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-dev-jwt-secret-change-me
      ANTI_CHEAT_SIGNING_SECRET: local-dev-ac-secret-change-me

volumes:
  pgdata: {}
