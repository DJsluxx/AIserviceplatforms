<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="PEELED app icon">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#FFF5E8"/>
      <stop offset="1" stop-color="#F2DBB5"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9B28A"/>
      <stop offset="0.55" stop-color="#B58668"/>
      <stop offset="1" stop-color="#8B5E3C"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7E66"/>
      <stop offset="1" stop-color="#E25038"/>
    </linearGradient>
    <linearGradient id="ribbonSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="fibers" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="transparent"/>
      <path d="M0 20 Q20 10 40 20 T80 20" stroke="#8B5E3C" stroke-opacity="0.08" stroke-width="1.5" fill="none"/>
      <path d="M0 60 Q20 50 40 60 T80 60" stroke="#8B5E3C" stroke-opacity="0.05" stroke-width="1.5" fill="none"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- soft cast shadow -->
  <ellipse cx="512" cy="780" rx="260" ry="30" fill="#1A1B2E" opacity="0.18" filter="url(#soft)"/>

  <!-- package body -->
  <g transform="translate(232 260)">
    <rect x="0" y="0" width="560" height="460" rx="46" ry="46" fill="url(#paper)"/>
    <rect x="0" y="0" width="560" height="460" rx="46" ry="46" fill="url(#fibers)"/>
    <!-- crease highlights -->
    <path d="M0 30 Q280 10 560 30" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" fill="none"/>
    <path d="M0 430 Q280 450 560 430" stroke="#1A1B2E" stroke-opacity="0.08" stroke-width="2" fill="none"/>
    <!-- corner folds -->
    <path d="M0 46 L36 0 L0 0 Z" fill="#8B5E3C" opacity="0.6"/>
    <path d="M560 46 L524 0 L560 0 Z" fill="#8B5E3C" opacity="0.6"/>
    <path d="M0 414 L36 460 L0 460 Z" fill="#8B5E3C" opacity="0.6"/>
    <path d="M560 414 L524 460 L560 460 Z" fill="#8B5E3C" opacity="0.6"/>
  </g>

  <!-- vertical ribbon -->
  <rect x="472" y="240" width="80" height="500" rx="10" fill="url(#ribbon)"/>
  <rect x="472" y="240" width="80" height="500" rx="10" fill="url(#ribbonSheen)"/>
  <!-- horizontal ribbon -->
  <rect x="220" y="450" width="584" height="80" rx="10" fill="url(#ribbon)"/>
  <rect x="220" y="450" width="584" height="80" rx="10" fill="url(#ribbonSheen)"/>

  <!-- bow forming loose P -->
  <g transform="translate(512 460)">
    <!-- loop -->
    <ellipse cx="-60" cy="-32" rx="72" ry="44" fill="url(#ribbon)"/>
    <ellipse cx="-60" cy="-32" rx="30" ry="16" fill="#FFF5E8"/>
    <ellipse cx="50" cy="-18" rx="50" ry="28" fill="url(#ribbon)" transform="rotate(20 50 -18)"/>
    <!-- knot -->
    <rect x="-18" y="-44" width="36" height="60" rx="8" fill="#C2442F"/>
    <!-- tails -->
    <path d="M-10 16 Q-40 80 -12 150 Q8 170 20 150 Q40 80 10 16 Z" fill="url(#ribbon)"/>
  </g>

  <!-- gold particles -->
  <g fill="#F2B84B" opacity="0.9">
    <circle cx="190" cy="300" r="6"/>
    <circle cx="160" cy="420" r="4"/>
    <circle cx="230" cy="540" r="5"/>
    <circle cx="820" cy="320" r="6"/>
    <circle cx="860" cy="450" r="4"/>
    <circle cx="790" cy="580" r="5"/>
    <circle cx="512" cy="200" r="4"/>
    <circle cx="420" cy="180" r="3"/>
    <circle cx="600" cy="180" r="3"/>
  </g>
</svg>
