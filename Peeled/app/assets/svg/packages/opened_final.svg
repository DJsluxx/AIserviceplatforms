<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Opened PEELED package">
  <defs>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A0"/>
      <stop offset="1" stop-color="#F2B84B"/>
    </linearGradient>
    <radialGradient id="beam" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#FFF5E8" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#FFE9A0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flaps" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9B28A"/>
      <stop offset="1" stop-color="#8B5E3C"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- beam of light streaming out of box -->
  <path d="M80 180 L320 180 L400 0 L0 0 Z" fill="url(#beam)"/>

  <!-- cast shadow -->
  <ellipse cx="200" cy="322" rx="130" ry="14" fill="#1A1B2E" opacity="0.3" filter="url(#soft)"/>

  <!-- box walls (after peel — flaps out) -->
  <polygon points="90,180 310,180 340,310 60,310" fill="#B58668"/>
  <polygon points="90,180 310,180 310,190 90,190" fill="#8B5E3C"/>

  <!-- open flaps -->
  <polygon points="90,180 60,110 120,130 150,180" fill="url(#flaps)"/>
  <polygon points="150,180 120,130 200,120 200,180" fill="url(#flaps)" opacity="0.9"/>
  <polygon points="250,180 200,120 280,130 300,180" fill="url(#flaps)" opacity="0.9"/>
  <polygon points="310,180 340,110 280,130 250,180" fill="url(#flaps)"/>

  <!-- prize glow at top -->
  <circle cx="200" cy="170" r="44" fill="url(#inner)"/>
  <circle cx="200" cy="170" r="24" fill="#FFFFFF" opacity="0.9"/>

  <!-- particles -->
  <g fill="#F2B84B">
    <circle cx="90" cy="90" r="4"/>
    <circle cx="310" cy="90" r="4"/>
    <circle cx="60" cy="140" r="3"/>
    <circle cx="340" cy="140" r="3"/>
    <circle cx="140" cy="60" r="3"/>
    <circle cx="260" cy="60" r="3"/>
    <circle cx="200" cy="40" r="5"/>
  </g>
</svg>
