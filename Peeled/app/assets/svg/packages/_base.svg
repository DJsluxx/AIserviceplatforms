<?xml version="1.0" encoding="UTF-8"?>
<!--
  PEELED — base package template.

  This file is the canonical layered structure. Each rarity in /packages/
  inherits this geometry and swaps palette tokens. The peel animation code
  in lib/features/package/animations/peel_painter.dart expects these
  layer group IDs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="PEELED package template">
  <defs>
    <!-- Rarity tokens are overridden per-file. -->
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9D3B8"/>
      <stop offset="0.55" stop-color="#B58668"/>
      <stop offset="1" stop-color="#8B5E3C"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7E66"/>
      <stop offset="1" stop-color="#E25038"/>
    </linearGradient>
    <linearGradient id="ribbonSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#F2E7CA" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F2E7CA" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="fibers" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 10 Q10 5 20 10 T40 10" stroke="#8B5E3C" stroke-opacity="0.1" stroke-width="0.8" fill="none"/>
      <path d="M0 30 Q10 25 20 30 T40 30" stroke="#8B5E3C" stroke-opacity="0.06" stroke-width="0.8" fill="none"/>
    </pattern>
  </defs>

  <g id="glow">
    <circle cx="200" cy="200" r="180" fill="url(#glow)"/>
  </g>

  <g id="shadow">
    <ellipse cx="200" cy="320" rx="120" ry="12" fill="#1A1B2E" opacity="0.22" filter="url(#soft)"/>
  </g>

  <g id="body">
    <rect x="90" y="110" width="220" height="180" rx="18" fill="url(#paper)"/>
    <rect x="90" y="110" width="220" height="180" rx="18" fill="url(#fibers)"/>
    <path d="M90 120 Q200 108 310 120" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.2" fill="none"/>
    <path d="M90 280 Q200 292 310 280" stroke="#1A1B2E" stroke-opacity="0.08" stroke-width="1.2" fill="none"/>
    <path d="M90 128 L108 110 L90 110 Z" fill="#8B5E3C" opacity="0.55"/>
    <path d="M310 128 L292 110 L310 110 Z" fill="#8B5E3C" opacity="0.55"/>
    <path d="M90 272 L108 290 L90 290 Z" fill="#8B5E3C" opacity="0.55"/>
    <path d="M310 272 L292 290 L310 290 Z" fill="#8B5E3C" opacity="0.55"/>
  </g>

  <g id="ribbon">
    <rect x="186" y="100" width="28" height="200" rx="4" fill="url(#ribbon)"/>
    <rect x="186" y="100" width="28" height="200" rx="4" fill="url(#ribbonSheen)"/>
    <rect x="80" y="186" width="240" height="28" rx="4" fill="url(#ribbon)"/>
    <rect x="80" y="186" width="240" height="28" rx="4" fill="url(#ribbonSheen)"/>
  </g>

  <g id="bow" transform="translate(200 200)">
    <ellipse cx="-28" cy="-14" rx="30" ry="18" fill="url(#ribbon)"/>
    <ellipse cx="-28" cy="-14" rx="12" ry="7" fill="#FFF5E8"/>
    <ellipse cx="28" cy="-14" rx="30" ry="18" fill="url(#ribbon)"/>
    <ellipse cx="28" cy="-14" rx="12" ry="7" fill="#FFF5E8"/>
    <rect x="-8" y="-18" width="16" height="26" rx="3" fill="#C2442F"/>
  </g>

  <g id="seal" transform="translate(256 252)">
    <circle r="16" fill="#C2442F"/>
    <circle r="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-family="Fraunces, serif" font-size="18" font-weight="800" fill="#FFF5E8">P</text>
  </g>

  <!-- rarity flourish slot — replaced per rarity -->
  <g id="flourish"/>
</svg>
