name: peeled
description: PEELED — a global viral game where mysterious packages travel the world.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & architecture
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  go_router: ^14.2.0

  # Network
  dio: ^5.6.0
  web_socket_channel: ^3.0.0

  # Storage / auth
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  supabase_flutter: ^2.5.11

  # UI & animation
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  rive: ^0.13.13
  lottie: ^3.1.2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1

  # Maps & globe
  mapbox_maps_flutter: ^2.2.0

  # Utilities
  intl: ^0.20.2
  collection: ^1.18.0
  logger: ^2.4.0
  uuid: ^4.4.2
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  firebase_core: ^3.4.1
  firebase_messaging: ^15.1.1
  posthog_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/svg/logo/
    - assets/svg/packages/
    - assets/svg/icons/
    - assets/images/
  # Fonts are served via google_fonts at runtime (no local ttf files checked in).
  # To ship offline-first fonts, download Fraunces/Inter ttf files into
  # assets/fonts/ and restore a fonts: block here.
