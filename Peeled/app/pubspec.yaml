name: peeled
description: PEELED — a global viral game where mysterious packages travel the world.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & architecture
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Network
  dio: ^5.6.0

  # Storage / auth
  flutter_secure_storage: ^9.2.2

  # UI & animation
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/svg/logo/
    - assets/svg/packages/
    - assets/svg/icons/
    - assets/images/generated/
  # Fonts are served via google_fonts at runtime (no local ttf files checked in).
  # To ship offline-first fonts, download Fraunces/Inter ttf files into
  # assets/fonts/ and restore a fonts: block here.
