name: server

on:
  push:
    paths:
      - "server/**"
      - "db/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "db/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: server/pyproject.toml
      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: server
        run: ruff check app tests
      - name: Types
        working-directory: server
        run: mypy app || true
      - name: Test
        working-directory: server
        env:
          PEELED_ENV: test
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/peeled_test
          REDIS_URL: redis://localhost:6379/15
          JWT_SECRET: ci-jwt-secret
          ANTI_CHEAT_SIGNING_SECRET: ci-ac-secret
        run: pytest -q --cov=app --cov-report=term-missing tests/unit
