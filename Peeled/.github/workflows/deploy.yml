name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.head_commit.message, '[deploy]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f infra/Dockerfile.server -t peeled-server:${{ github.sha }} .
      - name: Deploy placeholder
        run: |
          echo "Deploy to Cloud Run / fly.io goes here."
          echo "image: peeled-server:${{ github.sha }}"
