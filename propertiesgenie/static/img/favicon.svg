<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c542"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>
  <!-- Magic lamp / genie base -->
  <circle cx="32" cy="32" r="30" fill="url(#g1)" opacity="0.15"/>
  <circle cx="32" cy="32" r="24" fill="#131828" stroke="url(#g1)" stroke-width="2"/>
  <!-- Key icon (golden) -->
  <g transform="translate(32,32) rotate(-30)">
    <circle cx="0" cy="-6" r="7" fill="none" stroke="url(#g2)" stroke-width="3"/>
    <rect x="-1.5" y="1" width="3" height="14" rx="1.5" fill="url(#g2)"/>
    <rect x="1.5" y="10" width="5" height="3" rx="1" fill="url(#g2)"/>
    <rect x="1.5" y="6" width="4" height="3" rx="1" fill="url(#g2)"/>
  </g>
  <!-- Sparkle dots -->
  <circle cx="12" cy="14" r="2" fill="#f5c542" opacity="0.8"/>
  <circle cx="52" cy="16" r="1.5" fill="#22d3ee" opacity="0.7"/>
  <circle cx="50" cy="48" r="1.8" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="14" cy="50" r="1.3" fill="#f5c542" opacity="0.5"/>
