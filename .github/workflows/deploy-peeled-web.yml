name: Deploy PEELED Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Peeled/app/**'
      - '.github/workflows/deploy-peeled-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-peeled-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Flutter pub get
        working-directory: Peeled/app
        run: flutter pub get

      - name: Build web
        working-directory: Peeled/app
        run: flutter build web --release --base-href /aiserviceplatforms/

      - name: Add SPA 404 fallback
        run: cp Peeled/app/build/web/index.html Peeled/app/build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Peeled/app/build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
