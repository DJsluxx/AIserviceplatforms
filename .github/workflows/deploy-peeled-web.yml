name: Deploy PEELED Web to GitHub Pages

# Deploys Peeled/app as a Flutter web build to GitHub Pages by publishing
# build/web/ onto the `gh-pages` branch. Works with Pages Source =
# "Deploy from a branch" → gh-pages → / (root), which is the default
# on GitHub's mobile UI.

on:
  push:
    branches: [main]
    paths:
      - 'Peeled/app/**'
      - '.github/workflows/deploy-peeled-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-peeled-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Flutter pub get
        working-directory: Peeled/app
        run: flutter pub get

      - name: Build web
        working-directory: Peeled/app
        run: flutter build web --release --base-href /AIserviceplatforms/

      - name: Add SPA 404 fallback
        run: cp Peeled/app/build/web/index.html Peeled/app/build/web/404.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Peeled/app/build/web
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "deploy: ${{ github.sha }}"
