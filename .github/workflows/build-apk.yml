name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'profit-prophet/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Bundle PWA into Android assets
        run: |
          mkdir -p android/app/src/main/assets/pwa
          cp -r profit-prophet/* android/app/src/main/assets/pwa/
          ls -la android/app/src/main/assets/pwa/

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: android
        run: |
          gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/SCRY.apk
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCRY-APK
          path: dist/SCRY.apk
          retention-days: 30

      - name: Publish to latest release (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK
          body: |
            Latest SCRY Android build.
            Download `SCRY.apk` below, open it on your phone, allow "install from unknown sources", done.
          files: dist/SCRY.apk
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
